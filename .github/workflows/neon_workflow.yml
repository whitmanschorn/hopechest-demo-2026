name: Create/Delete Branch for Pull Request

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  setup:
    name: Setup
    outputs:
      branch: ${{ steps.branch_name.outputs.current_branch }}
    runs-on: ubuntu-latest
    steps:
      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@v8

  create_neon_branch:
    name: Create Neon Branch & run login E2E
    needs: setup
    if: |
      github.event_name == 'pull_request' && (
      github.event.action == 'synchronize'
      || github.event.action == 'opened'
      || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    # schema-diff posts its comparison as a PR comment.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Get branch expiration date as an env variable (2 weeks from now)
        id: get_expiration_date
        run: echo "EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create Neon Branch
        id: create_neon_branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}

      # --- Run the login E2E against this PR's isolated branch ---------------
      # Steps must live in this job: the branch connection strings are step
      # outputs and can't be passed to another workflow. The app reads
      # POSTGRES_PRISMA_URL (pooled = db_url_pooled) at runtime and
      # POSTGRES_URL_NON_POOLING (direct = db_url) for migrations/seed.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Migrate, seed & build
        env:
          POSTGRES_URL_NON_POOLING: ${{ steps.create_neon_branch.outputs.db_url }}
          POSTGRES_PRISMA_URL: ${{ steps.create_neon_branch.outputs.db_url_pooled }}
        run: |
          npm run db:deploy
          npm run db:seed
          npm run build

      # Post a comment on the PR showing how this branch's schema differs from
      # production (i.e. what the PR's migrations change). Compares the migrated
      # PR branch against its parent.
      - name: Post schema diff comment to PR
        uses: neondatabase/schema-diff-action@v1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          compare_branch: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Run Playwright login suite
        env:
          POSTGRES_URL_NON_POOLING: ${{ steps.create_neon_branch.outputs.db_url }}
          POSTGRES_PRISMA_URL: ${{ steps.create_neon_branch.outputs.db_url_pooled }}
          PHONE_PROVIDER: dev
          CI: "true"
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  delete_neon_branch:
    name: Delete Neon Branch
    needs: setup
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon Branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}
