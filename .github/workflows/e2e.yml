name: E2E (login)

# Runs the Playwright login suite against an ephemeral, isolated Neon branch —
# Neon's recommended CI pattern (https://neon.com/docs/guides/branching-github-actions).
# Each run branches the real Neon database (instant, copy-on-write), migrates +
# seeds it, builds & starts the app, runs the tests, then deletes the branch.
#
# Requires (set once via the Neon GitHub integration, or by hand):
#   secrets.NEON_API_KEY   — Neon API key
#   vars.NEON_PROJECT_ID   — Neon project id
# Note: secrets are unavailable to PRs from forks, so this job only runs for
# branches pushed to this repo.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Skip on fork PRs, which can't read NEON_API_KEY.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      BRANCH_NAME: ci-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Create ephemeral Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ env.BRANCH_NAME }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Migrate, seed & build
        env:
          # Migrations + seed use the direct (non-pooling) URL; the app runtime
          # uses the pooled one. These are the var names src/lib/prisma.ts and
          # prisma.config.ts read.
          POSTGRES_URL_NON_POOLING: ${{ steps.neon.outputs.db_url }}
          POSTGRES_PRISMA_URL: ${{ steps.neon.outputs.db_url_pooled }}
        run: |
          npm run db:deploy
          npm run db:seed
          npm run build

      - name: Run Playwright login suite
        env:
          POSTGRES_URL_NON_POOLING: ${{ steps.neon.outputs.db_url }}
          POSTGRES_PRISMA_URL: ${{ steps.neon.outputs.db_url_pooled }}
          PHONE_PROVIDER: dev
          CI: "true"
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Delete ephemeral Neon branch
        if: always()
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ env.BRANCH_NAME }}
          api_key: ${{ secrets.NEON_API_KEY }}
